/**/*:
  ros__parameters:
    broker:
      host: localhost
      port: 1883
    bridge:
      ros2mqtt:
        ros_topics: 
          - /feedback
          - /pingpong/ros
        /feedback:
          mqtt_topic: feedback
        /pingpong/ros:
          mqtt_topic: pingpong/ros
      mqtt2ros:
        mqtt_topics: 
          - move
          - drop
          - pick_up
          - ping/ros
        move:
          ros_topic: move
          ros_type: std_msgs/msg/Float32MultiArray
          primitive: true
        drop:
          ros_topic: drop
          ros_type: std_msgs/msg/String
          primitive: true
        pick_up:
          ros_topic: pick_up
          ros_type: std_msgs/msg/String
          primitive: true
        ping/ros:
          ros_topic: ping/ros
          primitive: true

        