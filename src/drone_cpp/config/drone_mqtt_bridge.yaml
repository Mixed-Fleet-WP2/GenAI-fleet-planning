/**/*:
  ros__parameters:
    broker:
      host: localhost
      port: 1883
    bridge:
    #ROS topics with the starting slash are considered as global topics (not namespaced by ros2)
    # feedback is namespaced by the robot namespace
      mqtt2ros:
        mqtt_topics: 
          - <robot_namespace>/move
          - <robot_namespace>/search
        <robot_namespace>/move:
          ros_topic: /<robot_namespace>/move
          ros_type: std_msgs/msg/String
          primitive: true
        <robot_namespace>/search:
          ros_topic: /<robot_namespace>/search
          ros_type: std_msgs/msg/String
          primitive: true
        