/**/*:
  ros__parameters:
    broker:
      host: localhost
      port: 1883
    bridge:
    #ROS topics with the starting slash are considered as global topics (not namespaced by ros2)
      ros2mqtt:
        ros_topics: 
          - /feedback
          - /pallet_1_pos
        /feedback:
          mqtt_topic: feedback
          ros_type: std_msgs/msg/String
          primitive: true
        /pallet_1_pos:
          mqtt_topic: pallet_1_pos
      mqtt2ros:
        mqtt_topics: 
          - <robot_namespace>/move
          - <robot_namespace>/drop
          - <robot_namespace>/pick_up
          - <robot_namespace>/move_fork
        <robot_namespace>/move:
          ros_topic: /<robot_namespace>/move
          ros_type: std_msgs/msg/String
          primitive: true
        <robot_namespace>/drop:
          ros_topic: /<robot_namespace>/drop
          ros_type: std_msgs/msg/String
          primitive: true
        <robot_namespace>/pick_up:
          ros_topic: /<robot_namespace>/pick_up
          ros_type: std_msgs/msg/String
          primitive: true
        <robot_namespace>/move_fork:
          ros_topic: /<robot_namespace>/move_fork
          ros_type: std_msgs/msg/String
          primitive: true
        