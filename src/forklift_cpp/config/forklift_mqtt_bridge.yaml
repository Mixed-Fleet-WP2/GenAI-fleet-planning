/**/*:
  ros__parameters:
    broker:
      host: <hostname>
      port: <port>
    bridge:
      ros2mqtt:
        ros_topics: 
          - /<robot_namespace>/move/feedback
          - /<robot_namespace>/pick_up/feedback
          - /<robot_namespace>/drop/feedback
        /<robot_namespace>/move/feedback:
          mqtt_topic: <robot_namespace>/move/feedback
          primitive: true
          ros_type: std_msgs/msg/String
        /<robot_namespace>/drop/feedback:
          mqtt_topic: <robot_namespace>/drop/feedback
          primitive: true
          ros_type: std_msgs/msg/String
        /<robot_namespace>/pick_up/feedback:
          mqtt_topic: <robot_namespace>/pick_up/feedback
          primitive: true
          ros_type: std_msgs/msg/String
      mqtt2ros:
        mqtt_topics: 
          - <robot_namespace>/move
          - <robot_namespace>/drop
          - <robot_namespace>/pick_up
          - <robot_namespace>/move_fork
        <robot_namespace>/move:
          ros_topic: /<robot_namespace>/move
          ros_type: std_msgs/msg/String
          primitive: true
        <robot_namespace>/drop:
          ros_topic: /<robot_namespace>/drop
          ros_type: std_msgs/msg/String
          primitive: true
        <robot_namespace>/pick_up:
          ros_topic: /<robot_namespace>/pick_up
          ros_type: std_msgs/msg/String
          primitive: true
        <robot_namespace>/move_fork:
          ros_topic: /<robot_namespace>/move_fork
          ros_type: std_msgs/msg/String
          primitive: true
        