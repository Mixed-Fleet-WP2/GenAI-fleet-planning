# Bridge clock only once, see: https://github.com/gazebosim/ros_gz/issues/591
- topic_name: "/clock"
  gz_type_name: "gz.msgs.Clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  direction: GZ_TO_ROS

#This topic is not namespaced by ros2 because it is absolute
- gz_topic_name: "/model/pallet_1/pose"
  ros_topic_name: "/object_state_updates_gz"
  gz_type_name: "gz.msgs.Pose_V"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  direction: GZ_TO_ROS