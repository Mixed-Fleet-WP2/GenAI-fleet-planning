drone:
  primitives:
    move:
      args: ["x", "y", "z", "roll", "pitch", "yaw"]
      args_type: ["float", "float", "float", "float", "float", "float"]
      description: "Move the drone to a specified position in 3D space. Coordinates are absolute"
forklift:
  primitives:
    move:
      args: ["x", "y", "z", "roll", "pitch", "yaw"]
      args_type: ["float", "float", "float", "float", "float", "float"]
      description: "Move the forklift to a specified position in 3D space. Coordinates are absolute"
    drop:
      args: ["object"]
      args_type: ["string"]
      description: "Drop an object that has been picked up."
    pick_up:
      args: ["object"]
      args_type: ["string"]
      description: "Pick up an object by its name."
    move_fork:
      args: ["position"]
      args_type: ["float"]
      description: "Move the forklift's fork to a specified height."
