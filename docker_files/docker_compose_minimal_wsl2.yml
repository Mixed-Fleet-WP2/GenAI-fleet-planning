# Original template from
# https://github.com/Cionix90/docker_simulator/blob/main/compose.yaml

# Modifications for WSL2
# https://github.com/gazebosim/gz-sim/issues/2595#issuecomment-3366197792
# https://github.com/microsoft/wslg/blob/main/samples%2Fcontainer%2FContainers.md#containerizing-gui-applications-with-wslg

version: '3.8'

services:
  ros2_gazebo:
    build:
      context: .
      args:
        - BASE_IMAGE=osrf/ros
        - BASE_TAG=jazzy-desktop-full
        - DISTRO=jazzy
        - WORKSPACE=docker_simulation_ws
    container_name: ros2_gazebo_sim
    network_mode: host
    stdin_open: true
    tty: true

    environment:
      # This has to be explicitly set for WSL2 to use the D3D12
      - LIBGL_ALWAYS_SOFTWARE=0
      #- GALLIUM_DRIVER=d3d12
      #- MESA_LOADER_DRIVER_OVERRIDE=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
      # WSL2 display - uses both X11 and Wayland
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib

      # WSL2 audio
      - PULSE_SERVER=${PULSE_SERVER}

      # Qt settings
      - QT_X11_NO_MITSHM=1

      # ROS 2
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - RCUTILS_COLORIZED_OUTPUT=1

      # Gazebo
      - GZ_VERSION=harmonic

      # NVIDIA - WSL2 uses D3D12 translation layer
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,graphics,display,video,utility,compute

      # Shell history
      - HISTFILE=/home/ros/.bash_history
      - HISTFILESIZE=10000

    volumes:
      # WSL2 display - needs both WSLg and X11 sockets
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg

      # WSL2 GPU - Windows driver bridge
      - /usr/lib/wsl:/usr/lib/wsl

      # Your workspace
      - ~/.bash_history:/home/ros/.bash_history
      - ./docker_simulator:/home/ros/docker_simulation_ws

    devices:
      # WSL2 DirectX GPU device - replaces /dev/nvidia0 etc from bare Linux
      - /dev/dxg:/dev/dxg

    privileged: true
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        source /home/ros/docker_simulation_ws/install/setup.bash 2>/dev/null || true &&
        echo 'ROS 2 Jazzy + Gazebo Harmonic ready' &&
        gz sim empty.sdf -v 4
      "